
name: Build MY IPTV APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Configure Vite for Android
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p='vite.config.ts'; let s=fs.readFileSync(p,'utf8'); if (!s.includes(\"base: './'\")) s=s.replace('defineConfig({', \"defineConfig({\\n  base: './',\"); fs.writeFileSync(p,s);"

      - name: Build website
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android
        run: npx cap sync android

      - name: Allow HTTP for IPTV server only
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false" />
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">nv2live.com</domain>
              </domain-config>
          </network-security-config>
          EOF
          node --input-type=module -e "import fs from 'node:fs'; const p='android/app/src/main/AndroidManifest.xml'; let s=fs.readFileSync(p,'utf8'); if (!s.includes('android:networkSecurityConfig=')) { if (!s.includes('<application')) throw new Error('Application tag not found'); s=s.replace('<application', '<application android:networkSecurityConfig=\"@xml/network_security_config\"'); } fs.writeFileSync(p,s);"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-IPTV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
